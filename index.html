<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing Detection Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a14;--panel:#0b1424;--line:#17314d;--cyan:#27e1ff;--mag:#ff3d81;--ok:#3dffa8;--text:#d6e6f5;--muted:#7f98b3;
--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--head:'Chakra Petch','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--head);min-height:100vh;padding:24px 16px 48px;position:relative}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:linear-gradient(rgba(39,225,255,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(39,225,255,.05) 1px,transparent 1px) 0 0/48px 48px,
radial-gradient(ellipse at 50% 0%,rgba(39,225,255,.14),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:.02em;color:#fff;text-shadow:0 0 18px rgba(39,225,255,.55)}
.sub{margin:4px 0 0;color:var(--muted);font-family:var(--mono);font-size:.78rem}
.hud{font-family:var(--mono);font-size:.82rem;display:flex;gap:10px}
.hud span{border:1px solid var(--line);background:rgba(11,20,36,.85);padding:6px 12px;border-radius:4px}
.hud b{color:var(--cyan)}
.bar{height:3px;background:var(--line);margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transition:width .4s}
.term{background:rgba(11,20,36,.92);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 0 40px rgba(39,225,255,.08)}
.term-top{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot:first-child{background:var(--mag)}
.mail{background:#fff;color:#202124;margin:14px;border-radius:6px;font-family:'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
.m-head{display:flex;gap:12px;padding:16px 18px;border-bottom:1px solid #e8eaed}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.m-sub{font-size:1.1rem;font-weight:600;margin:0 0 6px}
.m-from{font-size:.87rem}
.m-from em{font-style:normal;color:#5f6368}
.m-to{font-size:.78rem;color:#5f6368;margin-top:2px}
.m-to button{background:none;border:0;color:#1a73e8;cursor:pointer;font:inherit;padding:0 0 0 4px}
.m-det{display:none;font-size:.76rem;color:#3c4043;background:#f1f3f4;border-radius:4px;padding:8px 10px;margin-top:8px;line-height:1.6}
.m-det.on{display:block}
.m-body{padding:18px;font-size:.93rem;line-height:1.6;min-height:190px}
.m-body p{margin:0 0 12px}
.m-body a{color:#1a0dab}
.btn-m{display:inline-block;background:#1a73e8;color:#fff!important;text-decoration:none;padding:10px 22px;border-radius:4px;font-weight:600;margin:6px 0 12px}
.m-foot{font-size:.75rem;color:#6b6f73;border-top:1px solid #e8eaed;padding-top:10px;margin-top:10px}
.status{font-family:var(--mono);font-size:.74rem;background:#f1f3f4;color:#3c4043;padding:6px 14px;border-top:1px solid #dadce0;min-height:29px;overflow-wrap:anywhere}
.hint{padding:0 18px 12px;color:var(--muted);font-family:var(--mono);font-size:.74rem}
.acts{display:flex;gap:12px;padding:0 14px 14px;flex-wrap:wrap}
.btn{flex:1;min-width:160px;padding:13px;font:700 .95rem var(--head);letter-spacing:.03em;border-radius:4px;cursor:pointer;background:transparent;transition:background .15s,box-shadow .15s}
.b-ph{color:var(--mag);border:1px solid var(--mag)}.b-ph:hover:not(:disabled){background:rgba(255,61,129,.15);box-shadow:0 0 14px rgba(255,61,129,.4)}
.b-ok{color:var(--ok);border:1px solid var(--ok)}.b-ok:hover:not(:disabled){background:rgba(61,255,168,.12);box-shadow:0 0 14px rgba(61,255,168,.35)}
.b-nx{color:#04101c;background:var(--cyan);border:1px solid var(--cyan);width:100%;flex-basis:100%}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:focus-visible,.m-to button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fb{margin:0 14px 14px;padding:14px 16px;border-left:3px solid var(--cyan);background:rgba(39,225,255,.06);font-size:.9rem;line-height:1.55}
.fb h3{margin:0 0 6px;font-size:1.05rem}
.fb.good h3{color:var(--ok)}.fb.bad h3{color:var(--mag)}
.fb ul{margin:8px 0 0;padding-left:18px;font-family:var(--mono);font-size:.78rem;color:var(--text)}
.fb li{margin-bottom:4px}
.end{text-align:center;padding:40px 20px}
.end .big{font-size:3.4rem;color:var(--cyan);text-shadow:0 0 22px rgba(39,225,255,.6);margin:6px 0}
.end p{color:var(--muted);max-width:50ch;margin:8px auto 20px;line-height:1.55}
.hidden{display:none!important}
@media(max-width:520px){.btn{min-width:100%}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div>
      <h1>Phishing Detection Lab</h1>
      <p class="sub">// inspect the sender. hover the links. decide.</p>
    </div>
    <div class="hud"><span>CASE <b id="case">1</b>/<b id="count">8</b></span><span>SCORE <b id="score">0</b></span></div>
  </header>
  <div class="bar"><i id="bar"></i></div>

  <section class="term" id="game">
    <div class="term-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;inbox://suspect-queue</div>
    <article class="mail">
      <div class="m-head">
        <div class="av" id="av"></div>
        <div>
          <p class="m-sub" id="subj"></p>
          <div class="m-from"><strong id="name"></strong> <em id="addr"></em></div>
          <div class="m-to">to me <button id="tog" aria-expanded="false">Show details ▾</button></div>
          <div class="m-det" id="det"></div>
        </div>
      </div>
      <div class="m-body" id="body"></div>
      <div class="status" id="status">Hover or tap a link to see where it really goes.</div>
    </article>
    <div class="hint">Tip: the display name can say anything. Check the real address, the links and the pressure.</div>
    <div class="fb hidden" id="fb"></div>
    <div class="acts">
      <button class="btn b-ph" id="bp">⚠ Report as phishing</button>
      <button class="btn b-ok" id="bs">✓ Mark as safe</button>
      <button class="btn b-nx hidden" id="nx">Next case ▸</button>
    </div>
  </section>

  <section class="term end hidden" id="end">
    <div class="big" id="pct"></div>
    <h2 id="rank"></h2>
    <p id="msg"></p>
    <button class="btn b-nx" id="again" style="max-width:240px">Run again</button>
  </section>
</div>

<script>
const F=(t)=>`<div class="m-foot">${t}</div>`;
const EMAILS=[
{name:"IT Support Services Desk",addr:"admin-update@it-corporate-portal.com",init:"I",bg:"#1a73e8",
 subject:"Action Required: Enforce Mandatory Multi-Factor Authentication (MFA) Sync",
 det:"Reply-to: admin-update@it-corporate-portal.com<br>Authentication: SPF <b>softfail</b> · DKIM none",
 phish:true,
 body:`<p>Dear Employee,</p><p>Due to recent critical infrastructure security updates, all staff must synchronise their remote profiles with our new security node directory immediately.</p><p><b>Failure to complete this within 24 hours will trigger automatic account revocation.</b></p><a class="btn-m" href="#" data-url="https://it-corporate-portal.com/mfa-sync/login?id=8f21">Synchronize MFA Profile Now</a>${F("Sent by automated systems on behalf of Global Operations IT Command.")}`,
 flags:["Sender domain is a generic 'portal' lookalike, not your company's real domain","Generic greeting: 'Dear Employee'","24-hour deadline with account loss threat","Vague jargon ('security node directory') instead of a clear request"],
 why:"Real IT teams announce MFA changes through known channels and don't threaten lockouts from an unfamiliar domain."},
{name:"GitHub",addr:"noreply@github.com",init:"G",bg:"#24292e",
 subject:"[GitHub] A new personal access token was added to your account",
 det:"Reply-to: noreply@github.com<br>Authentication: SPF <b>pass</b> · DKIM <b>pass</b> · DMARC <b>pass</b>",
 phish:false,
 body:`<p>Hey there,</p><p>A personal access token (classic) with <b>repo, workflow</b> scopes was recently added to your account.</p><p>If you made this change, there's nothing more to do. If not, go to your account settings on github.com and revoke it.</p>${F("GitHub, Inc. · 88 Colin P. Kelly Jr Street · San Francisco, CA 94107")}`,
 flags:["Sender is the genuine github.com domain and authentication passes","No link or attachment: it tells you to go to settings yourself","No threat or deadline"],
 why:"Notifications like this are informational. The safest habit is still to open GitHub directly rather than via email."},
{name:"Royal Mail",addr:"delivery@royalmail-redelivery.help",init:"R",bg:"#d71920",
 subject:"We couldn't deliver your parcel: £1.99 fee to rebook",
 det:"Reply-to: noreply@royalmail-redelivery.help<br>Authentication: SPF <b>fail</b>",
 phish:true,
 body:`<p>Hello,</p><p>Your parcel <b>RM4402918836GB</b> could not be delivered due to an unpaid customs handling fee.</p><p>Pay <b>£1.99</b> within 12 hours or the parcel will be returned to sender.</p><a class="btn-m" style="background:#d71920" href="#" data-url="https://royalmail-redelivery.help/pay?ref=RM4402918836GB">Rebook delivery</a>${F("Royal Mail Group. Do not reply to this message.")}`,
 flags:["Royal Mail does not use a .help domain","Tiny fee is bait to capture your card details","Short deadline to stop you thinking","Link goes to the same fake domain"],
 why:"A small fee is the hook: the real goal is your card number and 3-D Secure code."},
{name:"Google",addr:"no-reply@accounts.google.com",init:"G",bg:"#ea4335",
 subject:"Security alert: new sign-in on Windows",
 det:"Reply-to: none<br>Authentication: SPF <b>pass</b> · DKIM <b>pass</b> · DMARC <b>pass</b>",
 phish:false,
 body:`<p><b>Your Google Account was just signed in to from a new Windows device.</b></p><p>If this was you, you don't need to do anything. If not, we'll help you secure your account.</p><a class="btn-m" href="#" data-url="https://myaccount.google.com/notifications">Check activity</a><p>You can also see security activity at <a href="#" data-url="https://myaccount.google.com/notifications">myaccount.google.com/notifications</a></p>${F("You received this email to let you know about important changes to your Google Account and services.")}`,
 flags:["Sender is accounts.google.com and authentication passes","Link destination is a real google.com address","Calm tone, no countdown"],
 why:"Even so, never sign in from a link if you didn't expect the mail: open your account in a fresh tab."},
{name:"Sarah Mitchell (CEO)",addr:"sarah.mitchell.ceo@gmail.com",init:"S",bg:"#7b3fe4",
 subject:"Quick favour, are you at your desk?",
 det:"Reply-to: <b>s.mitchell.office@outlook.com</b><br>Authentication: SPF <b>pass</b> (for gmail.com only)",
 phish:true,
 body:`<p>Hi,</p><p>I'm in meetings all day and can't talk. I need you to buy <b>5 × £100 Amazon gift cards</b> for a client surprise. I'll reimburse you today.</p><p>Please keep this confidential and send the codes by reply as soon as you have them.</p><p>Thanks,<br>Sarah<br><span style="color:#888">Sent from my iPhone</span></p>`,
 flags:["Executives don't email from personal Gmail addresses","Reply-to differs from the sender address","Gift cards, secrecy and urgency are classic fraud markers","No way to verify: 'can't talk'"],
 why:"This is business email compromise: it relies on authority. Always verify by calling a known number."},
{name:"PayPal Billing",addr:"service@paypa1-billing.com",init:"P",bg:"#003087",
 subject:"Invoice #INV-20431 paid: £489.99 to Apex Tech Ltd",
 det:"Reply-to: service@paypa1-billing.com<br>Authentication: SPF <b>none</b>",
 phish:true,
 body:`<p>Hello Customer,</p><p>You paid <b>£489.99</b> to <b>Apex Tech Ltd</b> for 1 × Gaming Laptop.</p><p>If you did not authorise this, call our dispute team now on <b>0800 046 1177</b> to cancel the payment before it ships.</p>${F("PayPal (Europe) S.à r.l. et Cie, S.C.A.")}`,
 flags:["'paypa1' uses the digit 1 instead of the letter l","'Hello Customer' instead of your name","Contains a phone number instead of a link, to avoid filters","Scare amount designed to make you panic-call"],
 why:"Callback phishing: the scammer on the phone asks for remote access or your bank details to 'reverse' the charge."},
{name:"HM Revenue & Customs",addr:"refunds@hmrc-taxrefund.co",init:"H",bg:"#00703c",
 subject:"You are eligible for a tax refund of £384.62",
 det:"Reply-to: refunds@hmrc-taxrefund.co<br>Authentication: SPF <b>fail</b>",
 phish:true,
 body:`<p>Dear Taxpayer,</p><p>After the latest review of your tax year, you are due a refund of <b>£384.62</b>.</p><p>Submit your bank details using the secure form below to receive payment within 3 working days.</p><a class="btn-m" style="background:#00703c" href="#" data-url="https://hmrc-taxrefund.co/claim/form.php">Claim your refund</a>${F("Her Majesty's Revenue and Customs. This is an automated message.")}`,
 flags:["Real HMRC emails come from gov.uk addresses","HMRC does not email you asking for bank details","Link points to a .co domain, not gov.uk","Generic 'Dear Taxpayer' greeting"],
 why:"Refund lures are among the most reported UK scams. Check your tax account only by typing the gov.uk address yourself."},
{name:"Amazon.co.uk",addr:"auto-confirm@amazon.co.uk",init:"a",bg:"#232f3e",
 subject:"Your order has been dispatched",
 det:"Reply-to: none<br>Authentication: SPF <b>pass</b> · DKIM <b>pass</b> · DMARC <b>pass</b>",
 phish:false,
 body:`<p>Hello Alex,</p><p>Your package with <b>USB-C Charging Cable (2 pack)</b> has been dispatched and is on its way.</p><p>Arriving: <b>Thursday</b></p><a class="btn-m" style="background:#ffd814;color:#111!important" href="#" data-url="https://www.amazon.co.uk/gp/your-account/order-details">View or manage order</a>${F("This email was sent from a notification-only address. Please do not reply.")}`,
 flags:["Addressed to your actual name","Real amazon.co.uk sender and link","Describes something you can verify in your orders","No payment or password request"],
 why:"If you weren't expecting an order, check your Amazon account directly instead of using the email."}
];

const $=id=>document.getElementById(id);
let order,i,score,locked;
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function start(){order=shuffle(EMAILS);i=0;score=0;$("count").textContent=order.length;$("score").textContent=0;$("end").classList.add("hidden");$("game").classList.remove("hidden");load()}
function load(){
  const e=order[i];locked=false;
  $("case").textContent=i+1;$("bar").style.width=(i/order.length*100)+"%";
  $("av").textContent=e.init;$("av").style.background=e.bg;
  $("name").textContent=e.name;$("addr").textContent="<"+e.addr+">";$("subj").textContent=e.subject;
  $("det").innerHTML=e.det;$("det").classList.remove("on");$("tog").textContent="Show details ▾";$("tog").setAttribute("aria-expanded","false");
  $("body").innerHTML=e.body;
  $("status").textContent="Hover or tap a link to see where it really goes.";
  $("fb").classList.add("hidden");$("nx").classList.add("hidden");
  $("bp").disabled=$("bs").disabled=false;
}
function answer(sayPhish){
  if(locked)return;locked=true;
  const e=order[i],ok=sayPhish===e.phish;if(ok)score++;
  $("score").textContent=score;
  const fb=$("fb");fb.className="fb "+(ok?"good":"bad");
  const verdict=e.phish?"This was phishing.":"This email was legitimate.";
  fb.innerHTML=`<h3>${ok?"Correct":"Not quite"}: ${verdict}</h3>${e.why}<ul>${e.flags.map(f=>`<li>${f}</li>`).join("")}</ul>`;
  $("bp").disabled=$("bs").disabled=true;
  $("nx").textContent=i===order.length-1?"See results ▸":"Next case ▸";
  $("nx").classList.remove("hidden");
}
function finish(){
  $("bar").style.width="100%";
  $("game").classList.add("hidden");$("end").classList.remove("hidden");
  const p=Math.round(score/order.length*100);
  $("pct").textContent=score+" / "+order.length;
  const r=p>=88?["Threat hunter","Sharp eyes. You checked senders, links and pressure tactics."]:p>=63?["Cautious analyst","Solid instincts. Review the cases you missed, especially lookalike domains."]:["Rookie","Phishing works because it feels urgent. Slow down, check the real sender and hover every link."];
  $("rank").textContent=r[0];$("msg").textContent=r[1];
}
$("bp").onclick=()=>answer(true);$("bs").onclick=()=>answer(false);
$("nx").onclick=()=>{i++;i>=order.length?finish():load()};
$("again").onclick=start;
$("tog").onclick=()=>{const on=$("det").classList.toggle("on");$("tog").textContent=on?"Hide details ▴":"Show details ▾";$("tog").setAttribute("aria-expanded",on)};
const body=$("body");
body.addEventListener("mouseover",e=>{const a=e.target.closest("a");if(a)$("status").textContent=a.dataset.url||""});
body.addEventListener("mouseout",e=>{if(e.target.closest("a"))$("status").textContent="Hover or tap a link to see where it really goes."});
body.addEventListener("click",e=>{const a=e.target.closest("a");if(a){e.preventDefault();$("status").textContent=a.dataset.url||""}});

/* cyber rain background */
(function(){
  const c=$("rain"),x=c.getContext("2d"),g="01{}<>/\\#$%&=+*ABCDEF";let cols,drops,fs=16;
  function size(){c.width=innerWidth;c.height=innerHeight;cols=Math.ceil(c.width/fs);drops=Array.from({length:cols},()=>Math.random()*c.height/fs)}
  size();addEventListener("resize",size);
  function draw(){
    x.fillStyle="rgba(5,10,20,.12)";x.fillRect(0,0,c.width,c.height);
    x.font=fs+"px JetBrains Mono, monospace";x.fillStyle="#27e1ff";
    drops.forEach((d,k)=>{x.fillText(g[Math.floor(Math.random()*g.length)],k*fs,d*fs);if(d*fs>c.height&&Math.random()>.975)drops[k]=0;drops[k]+=.5});
  }
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){c.style.display="none"}else setInterval(draw,50);
})();
start();
</script>
</body>
</html>
